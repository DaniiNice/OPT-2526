<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta http-equiv="X-UA-Compatible" content="ie=edge">
		<link rel="stylesheet" href="css/DanielFerreira.css">
		<title>Prueba</title>
	</head>
	<body>
		<form>
			<div class="Formulario">
				<div class="Titulo">PRUEBA 15 de Junio de 2026</div>
				<div class="Subtitulo"><p>Si aún no te has registrado hazlo aquí y comienza a disfrutar de enormes ventajas</p></div>

				<div class="Col1">
					<p>Nombre (*):</p>
					<p>NIF(*):</p>
					<p>Teléfono:</p>
					<p>Contraseña(*):</p>
				</div>

				<div class="Col2">
					<p><input type="text" size="20"></p>
					<p><input type="text" size="9"></p>
					<p><input type="text" size="9"></p>
					<p><input type="password" size="6"></p>
				</div>

				<div class="Col3">
					<p>Dirección:</p>
					<p>F.Nacimiento:</p>
					<p>Email:</p>
					<p>Rep.Contraseña(*):</p>
				</div>

				<div class="Col4">
					<p><input type="text" size="25"></p>
					<p><input type="text" size="1" maxlength="2" placeholder="dd">
					<input type="text" size="1" maxlength="2" placeholder="mm">
					<input type="text" size="1" maxlength="4" placeholder="aaaa"></p>
					<p><input type="text" size="25"></p>
					<p><input type="password" size="6"></p>
				</div>

				<div class="boton1">
					<input type="button" value="Enviar">
				</div>

				<div class="boton2">
					<input type="reset" value="Borrar">
				</div>

				<div class="obligatorios">
					<p>(*) Campos obligatorios</p>
				</div>
			</div>
		</form>
	</body>
</html>
