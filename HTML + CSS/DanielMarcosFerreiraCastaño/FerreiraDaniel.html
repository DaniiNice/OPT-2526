<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/FerreiraDaniel.css">
</head>
<body>
    <section class="Lista">
            <form class="form-foro">
                <div class="fila">
                    <p class="titulo">NUEVO MENSAJE PARA EL FORO - PRUEBA 29 de Mayo de 2026</p>
                    <label for="nombre">Autor (*):</label>
                    <input type="text" id="nombre" name="nombre" required>
                    <label for="Titulo">Título del mensaje:</label>
                    <input type="text" id="Titulo" name="Titulo" required>
                    <label for="mensaje">Mensaje(*):</label>
                    <textarea id="mensaje" name="mensaje" rows="7" cols="40" required></textarea>
                    <input type="submit" value="Enviar">
                    <input type="reset" value="Borrar">
                    <p>(*) Campos obligatorios</p>
                </div>
            </form>
    </section>
</body>
</html>
