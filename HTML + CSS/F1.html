<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulario de Registro</title>
</head>
<body>
     <h2>Formulario de Registro</h2>

    <form action="#" method="post">
        <p>
            <label for="nombre">Nombre:</label><br>
            <input type="text" id="nombre" name="nombre" maxlength="50" placeholder="Escribe tu nombre completo" required>
        </p>

        <p>
            <label for="email">Correo electrónico:</label><br>
            <input type="email" id="email" name="email" maxlength="30" placeholder="email@ejemplo.com" required>
        </p>

        <p>
            <label for="contrasena">Contraseña:</label><br>
            <input type="password" id="contrasena" name="contrasena" minlength="6" maxlength="20" placeholder="Contraseña de 6 a 20 caracteres" required>
        </p>

        <p>
            <label for="edad">Edad:</label><br>
            <input type="number" id="edad" name="edad" min="1" max="120" placeholder="Introduce tu edad" required>
        </p>

        <p>
            <label for="pais">País:</label><br>
            <select id="pais" name="pais" required>
                <option value="">Seleccione un país</option>
                <option value="España">España</option>
                <option value="México">México</option>
                <option value="Argentina">Argentina</option>
            </select>
        </p>

        <p>
            <label for="fecha">Fecha de nacimiento:</label><br>
            <input type="date" id="fecha" name="fecha" required>
        </p>

        <p>
            <label for="color">Color favorito:</label><br>
            <input type="color" id="color" name="color" required>
        </p>

        <p>Género:</p>
        <input type="radio" id="masculino" name="genero" value="Masculino" required>
        <label for="masculino">Masculino</label><br>
        <input type="radio" id="femenino" name="genero" value="Femenino" required>
        <label for="femenino">Femenino</label><br><br>

        <input type="checkbox" id="terminos" name="terminos" required>
        <label for="terminos">Acepto los términos y condiciones</label><br><br>

        <input type="submit" value="Registrarse">
    </form>
</body>
</html>
