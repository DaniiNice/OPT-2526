<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio con selectores</title>
    <link rel="stylesheet" href="css/estilos.css" type="text/css" />
</head>
<body>
    <h1>Ejercicio práctico con tabla</h1>

    <table>
        <caption>Título de la tabla</caption>
        <tr>
            <td></td>
            <th colspan="3"><img src="img/120_ipod.png"></th>
            <th colspan="2"><img src="img/100_ipod.png"></th>
        </tr>

        <tr>
            <th class="col1">Capacidad</th>
            <th class="gb">2GB</th>
            <th class="gb">4GB</th>
            <th class="gb">8GB</th>
            <th class="gb">32GB</th>
            <th class="gb">2GB</th>
        </tr>

        <tr>
            <th class="col1">Colores</th>
            <th>Blanco</th>
            <td>
                <ul>
                    <li>Negro</li>
                    <li>Rosa</li>
                    <li>Dorado</li>
                </ul>
            </td>
            <th>Negro</th>
            <td colspan="2">
                <ul>
                    <li>Negro</li>
                    <li>Blanco</li>
                </ul>
            </td>
        </tr>

        <tr>
            <th class="col1">Pantalla</th>
            <th colspan="3">3 pulgadas</th>
            <th colspan="2">7 pulgadas</th>
        </tr>

        <tr rowspan="2">
            <th class="col1" rowspan="2">Tiempo de carga</th>
            <th rowspan="2" colspan="3">1 hora</th>
            <th id="cinco" colspan="2">5 horas</th>
        </tr>
        <tr>
            <th  colspan="2">30 minutos para 75%</th>
        </tr>
    </table>
</body>
</html>
